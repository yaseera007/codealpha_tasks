<!DOCTYPE html>
<html>
<head>
    <title>AI Chatbot Assistant</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f4f6f9;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .chat-container{
            width:90%;
            max-width:800px;
            background:white;
            border-radius:15px;
            box-shadow:0 0 15px rgba(0,0,0,0.15);
            overflow:hidden;
        }

        .header{
            background:#0078d7;
            color:white;
            text-align:center;
            padding:20px;
        }

        .header h1{
            margin-bottom:5px;
        }

        .chat-box{
            height:500px;
            overflow-y:auto;
            padding:20px;
            background:#fafafa;
        }

        .message{
            margin-bottom:15px;
            max-width:75%;
            padding:12px;
            border-radius:10px;
            word-wrap:break-word;
        }

        .user{
            background:#0078d7;
            color:white;
            margin-left:auto;
            text-align:right;
        }

        .bot{
            background:#e9ecef;
            color:black;
        }

        .input-area{
            display:flex;
            padding:15px;
            border-top:1px solid #ddd;
        }

        #message{
            flex:1;
            padding:12px;
            border:1px solid #ccc;
            border-radius:5px;
            font-size:16px;
        }

        button{
            margin-left:10px;
            padding:12px 20px;
            border:none;
            background:#0078d7;
            color:white;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#005bb5;
        }

        .welcome{
            text-align:center;
            color:#555;
            margin-bottom:20px;
        }

    </style>
</head>

<body>

<div class="chat-container">

    <div class="header">
        <h1>AI Chatbot Assistant</h1>
        <p>Instant Customer Support & Information System</p>
    </div>

    <div class="chat-box" id="chat-box">

        <div class="welcome">
            👋 Welcome! Ask me about services, pricing, contact, AI, cloud computing and more.
        </div>

    </div>

    <div class="input-area">

        <input
            type="text"
            id="message"
            placeholder="Type your message..."
        >

        <button onclick="sendMessage()">
            Send
        </button>

    </div>

</div>

<script>

function addMessage(message, sender){

    let chatBox = document.getElementById("chat-box");

    let div = document.createElement("div");

    div.classList.add("message");

    if(sender === "user"){
        div.classList.add("user");
    }
    else{
        div.classList.add("bot");
    }

    div.innerText = message;

    chatBox.appendChild(div);

    chatBox.scrollTop = chatBox.scrollHeight;
}

function sendMessage(){

    let input = document.getElementById("message");

    let message = input.value.trim();

    if(message === ""){
        return;
    }

    addMessage(message, "user");

    fetch("/chat",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            message:message
        })

    })

    .then(response => response.json())

    .then(data => {

        addMessage(data.response, "bot");

    });

    input.value = "";
}

document.getElementById("message")
.addEventListener("keypress", function(event){

    if(event.key === "Enter"){
        sendMessage();
    }

});

</script>

</body>
</html>
